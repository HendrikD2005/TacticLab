[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
include = ["backend/**/*.py", "evals/**/*.py", "scripts/**/*.py", "quality/**/*.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["backend/app"]
data_file = "artifacts/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
